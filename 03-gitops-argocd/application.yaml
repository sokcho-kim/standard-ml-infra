apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-sample
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/standard-ml-infra.git
    targetRevision: main
    path: 02-kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: ml-standard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
